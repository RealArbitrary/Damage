name: Deploy to local server

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Fix git safe directory
        run: git config --global --add safe.directory C:/Users/dewet/OneDrive/Documents/repos/Damage

      - name: Pull latest code
        run: git -C C:\Users\dewet\OneDrive\Documents\repos\Damage pull origin master

      - name: Restart API service
        run: |
          C:\nssm\win64\nssm.exe stop DamageAPI
          C:\nssm\win64\nssm.exe start DamageAPI

      - name: Build React app
        working-directory: C:\Users\dewet\OneDrive\Documents\repos\Damage\damageui
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: |
          npm install
          npm run build

      - name: Restart UI service
        run: C:\nssm\win64\nssm.exe restart DamageUI